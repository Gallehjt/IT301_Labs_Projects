<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card-container {
            min-height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-card {
            border-radius: 12px;
            width: 320px;
            padding: 30px;
            text-align: center;
        }

        .profile-card img {
            border-radius: 50%;
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
        }

        .profile-card h2 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }

        .profile-card p {
            margin: 5px 0;
            color: #666666;
            font-size: 0.95rem;
        }

        .profile-card .phone {
            color: #888888;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .btn-generate {
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 25px;
        }

        .btn-generate:hover {
            background-color: #357abd;
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        .loading {
            color: #666666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="card-container" class="card-container">
        <p class="loading">Loading profile...</p>
    </div>
    <button id="generate-btn" class="btn-generate">Generate Profile</button>
    <script>
        const cardContainer = document.getElementById('card-container');
        const generateBtn = document.getElementById('generate-btn');
        async function fetchUser() {
            try {
                cardContainer.innerHTML = '<p class="loading">Fetching data...</p>';
                const response = await fetch('https://randomuser.me/api/');
                const data = await response.json();
                const user = data.results[0];
                const pictureUrl = user.picture.large;
                const fullName = `${user.name.first} ${user.name.last}`;
                const email = user.email;
                const phone = user.phone;
                cardContainer.innerHTML = `
                    <div class="profile-card">
                        <img src="${pictureUrl}" alt="${fullName}">
                        <h2>${fullName}</h2>
                        <p>${email}</p>
                        <p class="phone">📞 ${phone}</p>
                    </div>
                `;
            } catch (error) {
                console.error('Error fetching the user data:', error);
                cardContainer.innerHTML = '<p class="loading" style="color: red;">Failed to load user profile.</p>';
            }
        }
        generateBtn.addEventListener('click', fetchUser);
        fetchUser();
    </script>
</body>
</html>
