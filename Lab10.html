<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Tip Calculator</title>
</head>
<body>

<script>
    let billInput;
    let billAmount;
    let promptMessage = "Please enter the total restaurant bill amount.";

    do {
        billInput = prompt(promptMessage);

        if (billInput === null || billInput.trim() === "") {
            promptMessage = "Please enter a bill amount greater than zero.";
            billAmount = 0;
        }
        else {
            billAmount = Number(billInput);

            if (isNaN(billAmount)) {
                promptMessage = "Invalid input. Please enter a numeric bill amount.";
            }
            else if (billAmount < 0) {
                promptMessage = "Negative amounts are not allowed. Please enter a valid bill amount.";
            }
            else if (billAmount === 0) {
                promptMessage = "Please enter a bill amount greater than zero.";
            }
        }

    } while (isNaN(billAmount) || billAmount <= 0);

    let tip = billAmount * 0.10;

    let result =
        "For a bill of $" +
        billAmount.toFixed(2) +
        ", the tip should be $" +
        tip.toFixed(2) +
        ".";

    console.log(result);

    document.write("<h2>" + result + "</h2>");
</script>

</body>
</html>
