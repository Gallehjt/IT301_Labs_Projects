<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 16 - Form Validation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    input { margin: 5px 0 15px; padding: 5px; }
    .rules { margin-bottom: 15px; }
    .valid, .success { color: green; }
    .invalid, .error { color: red; }
  </style>
</head>
<body>
  <h2>Registration Form</h2>

  <form id="myForm" novalidate>
    <label for="name">Name:</label><br>
    <input type="text" id="name" placeholder="Enter your name" required><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" placeholder="Enter your email" required><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" placeholder="Enter your password" required><br>

    <div class="rules" id="password-rules" hidden>
      <div id="rule-length" class="rule">✖ At least 6 characters</div>
      <div id="rule-special" class="rule">✖ Must include a special character (!@#$...)</div>
      <div id="rule-uppercase" class="rule">✖ Must include an uppercase letter (A-Z)</div>
    </div>

    <button type="submit">Submit</button>
  </form>

  <p id="message"></p>

  <script>
    const form = document.getElementById("myForm");
    const passwordInput = document.getElementById("password");
    const rules = document.getElementById("password-rules");
    const message = document.getElementById("message");

    function checkPassword(password) {
      const lengthOK = password.length >= 6;
      const specialOK = /[!@#$%^&*(),.?":{}|<>]/.test(password);
      const uppercaseOK = /[A-Z]/.test(password);

      const checks = [
        ["rule-length", lengthOK, "At least 6 characters"],
        ["rule-special", specialOK, "Must include a special character (!@#$...)"],
        ["rule-uppercase", uppercaseOK, "Must include an uppercase letter (A-Z)"]
      ];

      checks.forEach(function (check) {
        const rule = document.getElementById(check[0]);
        rule.classList.toggle("valid", check[1]);
        rule.classList.toggle("invalid", !check[1]);
        rule.textContent = (check[1] ? "✔ " : "✖ ") + check[2];
      });

      return lengthOK && specialOK && uppercaseOK;
    }

    passwordInput.addEventListener("input", function () {
      rules.hidden = false;
      checkPassword(passwordInput.value);
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const emailInput = document.getElementById("email");
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!name || !email || !password) {
        message.textContent = "Please fill in all fields.";
        message.className = "error";
      } else if (!emailInput.validity.valid) {
        message.textContent = "Please enter a valid email.";
        message.className = "error";
      } else if (!checkPassword(password)) {
        rules.hidden = false;
        message.textContent = "Password does not meet all the rules.";
        message.className = "error";
      } else {
        message.textContent = "Form submitted successfully!";
        message.className = "success";
        form.reset();
        rules.hidden = true;
      }
    });
  </script>
</body>
</html>
