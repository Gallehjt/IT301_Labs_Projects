<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
       body {
          background-color: #f0f2f5;
          font-family: Helvetica, Arial, sans-serif;
       }

       form {
          min-height: 180px;
       }

       article, form {
          background-color: #ffffff;
          border-radius: 8px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
          padding: 12px 16px;
          margin-bottom: 16px;
          max-width: 680px;
          margin-left: auto;
          margin-right: auto;
       }

       h2 {
          color: #050505;
          font-size: 0.9375rem;
          font-weight: 600;
          margin: 0 0 4px 0;
       }

       p {
          color: #050505;
          font-size: 0.9375rem;
          line-height: 1.3333;
          margin: 8px 0 0 0;
       }
       .meta-info {
         font-size: 0.8 rem;
         color:#050505;
         margin:auto;
       }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>

    <script>
         const API_URL = "https://jsonplaceholder.typicode.com/posts";
         let postArray = [];

         function renderPosts(postsToRender) {
            document.querySelectorAll('article').forEach((article) => {
               article.remove();
            }
         )};

         const container = document.body;

         postsToRender.forEach(post => {
            const article = document.createElement('article');

            const h2 = document.createElement('h2')

            const p = document.createElement('p')
            
            const metaInfo = document.createElement('p')
            metaInfo.className = 'meta-info';
            metaInfo.textContent = 'User ID: ${post.userID} | Post ID: ${post.id}';
            article.appendChild(h2);
            article.appendChild(p);
            article.appendChild(metaInfo);
            article.appendChild(article);
         });

         function renderMessage(message) {
            document.querySelectorAll('article').forEach((article) => {
               article.remove();
            }
         )}
         
         const article = document.createElement('article');
         const p = document.createElement('p');
         p.textContent = message;
         article.appendChild(p);
         document.body.appendChild(article);
         
         async function fetchPosts() {
            try {
               const response = await fetch(API_URL);
               postsArray = await response.json();
               console.table(postsArray);
               renderPosts(postsArray);
            } catch (error) {
               console.error('Error', error);
            }
         }

         document.getElementById('filterBtn').addEventListener('click', () => {
            const selectedUserID = document.getElementById('userID').value;
            if (!selectedUserID) {
               console.warn('Select a user ID from the dropdown')};
               return;
         
         const filteredPosts = postsArray.filter(post => post.userID == selectedUserID);
         console.log('Posts from user ID ${selectedUserID}:');
         console.table(filteredPosts);
      });
      document.getElementById('displayUserBtn').addEventListener('click', () => {
         const enteredUserID = document.getElementById('displayUserID').value;
         if (!enteredUserID) {
            alert('Please enter a valid User ID');
            return;
         }
         const userPosts = postsArray.filter(post => post.userID == enteredUserID);
         if (userPosts.length > 0) {
            renderPosts
         }
      })

    </script>

</body>
</html>
